# Stack do wklejenia w Dockge.
# W sekcji .env stacka ustaw: ORIGIN=https://<adres, pod którym otwierasz aplikację>
services:
  zakupy:
    image: ghcr.io/zabqus/zakupy:latest
    container_name: zakupy
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ORIGIN=${ORIGIN}
      - DATABASE_PATH=/app/data/zakupy.db
    volumes:
      # Folder może zostać utworzony przez Dockge jako root — entrypoint obrazu sam poprawia uprawnienia.
      - ./data:/app/data
