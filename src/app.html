<!doctype html>
<html lang="pl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta name="color-scheme" content="light dark" />
		<meta id="theme-color" name="theme-color" content="#f3f4f1" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Zakupy" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon.svg" />
		<title>Zakupy</title>
		<script>
			(function () {
				try {
					var t = localStorage.getItem('zakupy:theme') || 'system';
					var dark =
						t === 'dark' ||
						(t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					var theme = dark ? 'dark' : 'light';
					document.documentElement.dataset.theme = theme;
					document.documentElement.style.colorScheme = theme;
					var meta = document.getElementById('theme-color');
					if (meta) meta.setAttribute('content', dark ? '#0f1112' : '#f3f4f1');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
